<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ganit Setu Facebook OAuth</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<p>Facebook authorization complete. This window will close automatically.</p>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const data = {
    type: 'GS_FACEBOOK_OAUTH_CALLBACK',
    code: params.get('code') || hash.get('code'),
    state: params.get('state') || hash.get('state'),
    error: params.get('error') || hash.get('error'),
    errorDescription: params.get('error_description') || hash.get('error_description')
  };
  if (window.opener) {
    window.opener.postMessage(data, location.origin);
    setTimeout(() => window.close(), 500);
  }
})();
</script>
</body>
</html>
