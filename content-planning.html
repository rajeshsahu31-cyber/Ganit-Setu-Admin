<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content Day Planning | Ganit Setu Admin</title>
<link rel="stylesheet" href="assets/css/content-planning.css">
</head>
<body>
<main class="content-page">
  <header class="page-header">
    <div>
      <h1>📅 Content Day Planning</h1>
      <p>Objective Questions से Day-wise Image, Post और Video Content Plan तैयार करें।</p>
    </div>
    <a class="back-btn" href="dashboard.html">← Dashboard</a>
  </header>

  <section class="panel">
    <h2>⚙️ Class 9 / 10 Settings</h2>
    <div id="settingsBox" class="settings-grid"></div>
  </section>

  <section class="panel">
    <h2>📊 Question Pool Status</h2>
    <div id="poolStatus" class="pool-grid-wrap"></div>
  </section>

  <section class="panel">
    <h2>🗓️ Plan बनाएं</h2>
    <div class="controls">
      <label>Start Date<input id="startDate" type="date"></label>
      <label>Questions / Class / Type
        <select id="questionsPerType">
          <option value="1" selected>1 Question</option><option value="2">2 Questions</option><option value="3">3 Questions</option><option value="4">4 Questions</option><option value="5">5 Questions</option>
        </select>
      </label>
      <label>Days
        <select id="days">
          <option value="1" selected>1 Day</option><option value="2">2 Days</option><option value="3">3 Days</option>
          <option value="4">4 Days</option><option value="5">5 Days</option><option value="6">6 Days</option><option value="7">7 Days</option>
        </select>
      </label>
    </div>
    <div class="button-row">
      <button id="generateBtn" class="primary-btn">🚀 Generate New Plan</button>
      <button id="replaceBtn" class="secondary-btn">♻️ Replace Existing Plan → नया Set</button>
    </div>
    <div id="notice" class="notice" hidden></div>
    <div id="planSummary" class="plan-summary"></div>
  </section>

  <section class="panel">
    <div class="filters">
      <label>Days<select id="dayFilter"><option value="all">सभी Days</option></select></label>
      <label>Classes<select id="classFilter"><option value="all">सभी Classes</option><option value="9">Class 9</option><option value="10">Class 10</option></select></label>
      <label>Content Type<select id="typeFilter"><option value="all">सभी Content Types</option><option value="image">🖼️ Image</option><option value="post">📱 Post</option><option value="video">🎬 Video</option></select></label>
    </div>
    <div id="planResults"><div class="empty-box">अभी कोई Plan generate नहीं हुआ है।</div></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/app.js"></script>
<script type="module" src="assets/js/content-planning.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const s=document.getElementById('days'), f=document.getElementById('dayFilter');
  if(s&&f) s.addEventListener('change',()=>{
    const n=Number(s.value); f.innerHTML='<option value="all">सभी Days</option>'+Array.from({length:n},(_,i)=>`<option value="${i+1}">Day ${i+1}</option>`).join('');
  });
});
</script>
</body>
</html>
