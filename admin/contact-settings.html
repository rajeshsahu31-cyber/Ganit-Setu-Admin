<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>संपर्क / सोशल लिंक | गणित सेतु</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.contact-box{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}
.contact-box h3{margin:0 0 10px}.contact-box label{display:block;font-weight:700;margin:12px 0 6px}
.contact-box input{width:100%;box-sizing:border-box}.contact-actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.social-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.social-preview div{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:#f8faff}
@media(max-width:700px){.contact-grid,.social-preview{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="simple-header"><a href="dashboard.html">← डैशबोर्ड</a><div class="mini-brand">🔗 संपर्क / सोशल लिंक</div></header>
<main class="page narrow"><section class="panel">
<h1>हमसे जुड़े रहें</h1>
<p class="muted">YouTube, Facebook, WhatsApp और Instagram के links यहाँ से बदलें।</p>
<div class="contact-grid">
<div class="contact-box"><h3>▶️ YouTube</h3><label>YouTube Link</label><input id="youtube" type="url" placeholder="https://youtube.com/..."></div>
<div class="contact-box"><h3>📘 Facebook</h3><label>Facebook Link</label><input id="facebook" type="url" placeholder="https://facebook.com/..."></div>
<div class="contact-box"><h3>💬 WhatsApp</h3><label>WhatsApp Link</label><input id="whatsapp" type="url" placeholder="https://wa.me/..."></div>
<div class="contact-box"><h3>📸 Instagram</h3><label>Instagram Link</label><input id="instagram" type="url" placeholder="https://instagram.com/..."></div>
</div>
<div class="contact-actions"><button class="primary-btn" id="saveBtn" type="button">💾 लिंक सेव करें</button><span id="status" class="muted"></span></div>
<div class="panel compact"><h2>Home Page Preview</h2>
<div class="social-preview"><div>▶️<br><b>YouTube</b></div><div>📘<br><b>Facebook</b></div><div>💬<br><b>WhatsApp</b></div><div>📸<br><b>Instagram</b></div></div>
</div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/app.js"></script><script src="assets/js/contact-settings.js"></script>
</body></html>
